<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
}

#flipbook {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 400px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
}

.book-wrap {
  position: relative;
  width: min(980px, 100%);
  height: 100%;
  padding: 0 54px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#book-container {
  width: 100%;
  height: min(82vh, 720px);
  min-height: 400px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#book-container > div {
  margin: 0 auto !important;
}

.nav-button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,253,249,.96);
  color: #5a3500;
  box-shadow: 0 5px 18px rgba(90,53,0,.14);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 0 3px;
}

.nav-button:hover {
  transform: translateY(-50%) scale(1.04);
}

#prev { left: 2px; }
#next { right: 2px; }

@media (max-width: 700px) {
  #flipbook {
    min-height: 360px;
  }

  .book-wrap {
    width: 100%;
    padding: 0 40px;
  }

  #book-container {
    height: calc(100vh - 20px);
    min-height: 360px;
    max-height: 620px;
  }

  .nav-button {
    width: 36px;
    height: 36px;
    font-size: 23px;
  }

  #prev { left: 0; }
  #next { right: 0; }
}
</style>
</head>

<body>
<div id="flipbook">
  <div class="book-wrap">
    <button class="nav-button" id="prev" aria-label="Previous page">‹</button>
    <div id="book-container"></div>
    <button class="nav-button" id="next" aria-label="Next page">›</button>
  </div>
</div>

<script>
const pages = [
  "pages/page-01.png",
  "pages/page-02.png",
  "pages/page-03.png",
  "pages/page-04.png",
  "pages/page-05.png",
  "pages/page-06.png",
  "pages/page-07.png",
  "pages/page-08.png",
  "pages/page-09.png",
  "pages/page-10.png"
];

const container = document.getElementById("book-container");

const pageFlip = new St.PageFlip(container, {
  width: 768,
  height: 1024,
  size: "stretch",
  minWidth: 280,
  maxWidth: 490,
  minHeight: 370,
  maxHeight: 680,
  showCover: true,
  usePortrait: true,
  mobileScrollSupport: true,
  maxShadowOpacity: 0.24,
  drawShadow: true,
  flippingTime: 900,
  startPage: 0,
  autoSize: true,
  clickEventForward: true,
  useMouseEvents: true,
  swipeDistance: 20
});

pageFlip.loadFromImages(pages);

document.getElementById("prev").addEventListener("click", () => {
  pageFlip.flipPrev();
});

document.getElementById("next").addEventListener("click", () => {
  pageFlip.flipNext();
});
</script>
</body>
</html>
