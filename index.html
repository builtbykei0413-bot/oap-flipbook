<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>If I Said This Back Then — Flipbook</title>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:transparent;
  overflow-x:hidden;
}

#flipbook{
  width:100%;
  display:flex;
  justify-content:center;
  background:transparent;
  padding:6px 0 8px;
}

.book-wrap{
  position:relative;
  width:100%;
  max-width:1080px;
  padding:0 48px;
  display:flex;
  justify-content:center;
  align-items:center;
}

#book-container{
  width:100%;
  max-width:980px;
  height:720px;
  margin:0 auto;
}

#book-container > div{
  margin:0 auto !important;
}

.nav-button{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:rgba(255,253,249,.96);
  color:#5a3500;
  box-shadow:0 6px 22px rgba(90,53,0,.14);
  font-family:Georgia,"Times New Roman",serif;
  font-size:28px;
  line-height:1;
  cursor:pointer;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 0 3px;
}

.nav-button:hover{
  transform:translateY(-50%) scale(1.04);
}

.nav-button:active{
  transform:translateY(-50%) scale(.98);
}

#prev{left:8px}
#next{right:8px}

/* TABLET */
@media (min-width:701px) and (max-width:1000px){
  #flipbook{
    padding:4px 0 7px;
  }

  .book-wrap{
    max-width:900px;
    padding:0 42px;
  }

  #book-container{
    max-width:800px;
    height:650px;
  }

  #prev{left:4px}
  #next{right:4px}
}

/* MOBILE */
@media(max-width:700px){
  #flipbook{
    padding:0 0 2px;
  }

  .book-wrap{
    width:100%;
    max-width:none;
    padding:0 28px;
  }

  #book-container{
    width:100%;
    max-width:none;
    height:calc(100vw - 10px);
    min-height:340px;
    max-height:520px;
  }

  .nav-button{
    width:36px;
    height:36px;
    font-size:22px;
  }

  #prev{left:0}
  #next{right:0}
}

/* SMALL PHONES */
@media(max-width:420px){
  .book-wrap{
    padding:0 25px;
  }

  #book-container{
    height:calc(100vw - 14px);
    min-height:320px;
    max-height:500px;
  }

  .nav-button{
    width:34px;
    height:34px;
    font-size:21px;
  }
}
</style>
</head>

<body>

<div id="flipbook">
  <div class="book-wrap">

    <button class="nav-button" id="prev" aria-label="Previous page">‹</button>

    <div id="book-container"></div>

    <button class="nav-button" id="next" aria-label="Next page">›</button>

  </div>
</div>

<script>
const pages = [
  "pages/page-01.png",
  "pages/page-02.png",
  "pages/page-03.png",
  "pages/page-04.png",
  "pages/page-05.png",
  "pages/page-06.png",
  "pages/page-07.png",
  "pages/page-08.png",
  "pages/page-09.png",
  "pages/page-10.png"
];

const container = document.getElementById("book-container");

const pageFlip = new St.PageFlip(container, {
  width:768,
  height:960,
  size:"stretch",

  minWidth:256,
  maxWidth:544,

  minHeight:320,
  maxHeight:680,

  showCover:true,
  usePortrait:true,
  mobileScrollSupport:true,

  maxShadowOpacity:0.20,
  drawShadow:true,

  flippingTime:850,
  startPage:0,

  autoSize:true,
  clickEventForward:true,
  useMouseEvents:true,
  swipeDistance:20
});

pageFlip.loadFromImages(pages);

document.getElementById("prev").addEventListener(
  "click",
  () => pageFlip.flipPrev()
);

document.getElementById("next").addEventListener(
  "click",
  () => pageFlip.flipNext()
);
</script>

</body>
</html>
