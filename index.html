<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>If I Said This Back Then — Preview</title>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
:root{
  --cream:#f8eee2;
  --brown:#5a3500;
  --orange:#f36b21;
  --white:#fffdf9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%}
body{
  background:var(--cream);
  color:var(--brown);
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden;
}
.preview-section{
  width:100%;
  padding:54px 20px 64px;
  text-align:center;
}
.eyebrow{
  margin:0 0 10px;
  color:var(--orange);
  font-family:Arial,sans-serif;
  font-size:15px;
  font-style:italic;
  letter-spacing:.04em;
  text-transform:uppercase;
}
h1{
  margin:0;
  font-size:clamp(38px,5vw,64px);
  line-height:1.05;
}
.subhead{
  max-width:720px;
  margin:16px auto 30px;
  font-size:clamp(17px,2vw,22px);
  line-height:1.5;
}
.book-wrap{
  position:relative;
  width:min(1100px,100%);
  margin:0 auto;
  padding:0 48px;
}
#book-container{
  width:100%;
  height:min(72vw,760px);
  min-height:470px;
  margin:0 auto;
}
.nav-button{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:var(--white);
  color:var(--brown);
  box-shadow:0 6px 22px rgba(90,53,0,.15);
  font-size:30px;
  line-height:1;
  cursor:pointer;
  z-index:10;
}
#prev{left:0}
#next{right:0}
.book-status{
  margin-top:18px;
  font-family:Arial,sans-serif;
  font-size:14px;
  letter-spacing:.08em;
}
.hint{
  margin:10px 0 0;
  color:rgba(90,53,0,.72);
  font-size:15px;
  font-style:italic;
}
.cta{
  display:inline-block;
  margin-top:28px;
  padding:16px 34px;
  border-radius:999px;
  background:var(--orange);
  color:#fff;
  text-decoration:none;
  font-family:Arial,sans-serif;
  font-weight:700;
  font-size:17px;
}
@media(max-width:700px){
  .preview-section{padding:36px 12px 48px}
  .book-wrap{padding:0 38px}
  #book-container{
    height:125vw;
    min-height:420px;
    max-height:680px;
  }
  .nav-button{
    width:40px;height:40px;font-size:24px
  }
}
</style>
</head>

<body>
<section class="preview-section">
  <p class="eyebrow">Before you decide, read a little.</p>
  <h1>Flip through a few pages.</h1>
  <p class="subhead">Get a glimpse of the heart, the words, and the journey inside the book.</p>

  <div class="book-wrap">
    <button class="nav-button" id="prev" aria-label="Previous page">‹</button>
    <div id="book-container"></div>
    <button class="nav-button" id="next" aria-label="Next page">›</button>
  </div>

  <div class="book-status"><span id="page-number">1</span> / 10</div>
  <p class="hint">Click the page, use the arrows, or swipe on mobile.</p>

  <!-- Replace this with OAP's actual Fillout order-form URL -->
  <a class="cta" href="YOUR-OAP-ORDER-FORM-URL">Get Your Copy →</a>
</section>

<script>
const pages = [
  "pages/page-01.png",
  "pages/page-02.png",
  "pages/page-03.png",
  "pages/page-04.png",
  "pages/page-05.png",
  "pages/page-06.png",
  "pages/page-07.png",
  "pages/page-08.png",
  "pages/page-09.png",
  "pages/page-10.png"
];

const container = document.getElementById("book-container");
const pageNumber = document.getElementById("page-number");

const pageFlip = new St.PageFlip(container, {
  width: 768,
  height: 1024,
  size: "stretch",
  minWidth: 280,
  maxWidth: 520,
  minHeight: 360,
  maxHeight: 700,
  showCover: true,
  usePortrait: true,
  mobileScrollSupport: true,
  maxShadowOpacity: 0.28,
  drawShadow: true,
  flippingTime: 900,
  startPage: 0,
  autoSize: true,
  clickEventForward: true,
  useMouseEvents: true,
  swipeDistance: 20
});

pageFlip.loadFromImages(pages);

pageFlip.on("flip", function(event) {
  pageNumber.textContent = event.data + 1;
});

document.getElementById("prev").addEventListener("click", () => pageFlip.flipPrev());
document.getElementById("next").addEventListener("click", () => pageFlip.flipNext());
</script>
</body>
</html>
